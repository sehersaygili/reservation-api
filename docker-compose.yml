services:
  app:
    build: .
    working_dir: /app
    volumes:
      - ./src:/app
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: reservation
      MYSQL_USER: reservation
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  db-data:
